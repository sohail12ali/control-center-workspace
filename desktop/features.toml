# Desktop feature registry — tray, hotkeys, and Settings all project this file.
# Schema is documented in knowledge-center/wiki/desktop-assistant.md
# (Tray as the desktop control surface). Do not grow the tray independently.
#
# Each [[features]] row:
#   id                 stable key; tray rows and hotkeys share this id
#   label              menu text
#   phase              1 shell · 2 capture/multimodal · 3 local STT · 4 clipboard/OCR
#                      · 5 actuation · 6 watch
#   group              window | listen | session | clipboard | capture | speak | watch | quit
#   risk               none | gated | dangerous
#   requires           capability tags the host must have:
#                      live_chat | stt_local | webview_speech | clipboard_read | capture
#   tray               show | hide | submenu | header
#   available          host can actually perform this from the tray today
#   enabled_default    off for mic, clipboard-read, capture, actuation
#   skeleton           first tray ticket (T-002) wires only these
#   never_one_click    tray may open the window / start listen; it must not approve
#   parent             submenu owner id (optional)
#   reason_unavailable shown when available=false (same honesty as voice.js)
#   hotkey             empty = unbound; Settings stores desktop.hotkey.{id}

[meta]
schema_version = 1
webview_speech_from_tray = false  # vendor STT from the tray needs an explicit later accept

[projection]
# Console Settings tab, desktop-only section (html.in-shell). Browser hides it.
settings_section = "desktop"
unavailable = "disabled"           # hide | disabled — default matches voice.js
prefs_prefix = "desktop.feature."  # C.prefs: desktop.feature.{id} = bool (clutter)
left_click_pref = "desktop.tray.left_click"          # show_window | listen_toggle
left_click_default = "show_window"
close_window_pref = "desktop.window.close_action"    # hide_to_tray | quit
close_window_default = "hide_to_tray"
hide_unavailable_pref = "desktop.tray.hide_unavailable"
hotkey_pref_prefix = "desktop.hotkey."               # desktop.hotkey.{id}

# ---------------------------------------------------------------------------
# Header (not a button) — cloud consent reminder
# ---------------------------------------------------------------------------

[[features]]
id = "session_backend"
label = "Current chat backend"
phase = 1
group = "session"
risk = "none"
requires = ["live_chat"]
tray = "header"
available = true
enabled_default = true
skeleton = true
never_one_click = false
reason_unavailable = ""
hotkey = ""

