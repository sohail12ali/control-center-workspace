[[items]]
id = "Q12"
status = "resolved"
text = "Who closes a ticket: the verifier that judged the criteria, or a separate actor behind the close-check gate?"
type = "decision"
priority = "critical"
raised_by = "analyst"
raised_on = "2026-10-01"
affects = []
answer = "Decided under delegated authority 2026-10-01, reversible (a12). The verifier reports a Disposition and stops at close-check; it does not run close-work. The harness (or the user) runs close-work, which goes through the guarded move. CLAUDE.md verifier row and harness.md row are edited to match; today verifier.md step 10 says close-work while its own output contract asks the user to approve it."
resolved_on = "2026-10-01"
