text = "Dossier item 5 says adopt when owner is dead OR claimed_at past a TTL; Paperclip never adopts a live owner's lock and has no TTL. Proposal: never expire a claim with a live owner; TTL only when owner liveness is unknown."
type = "decision"
priority = "high"
raised_by = "agent"
raised_on = "2026-10-01"
affects = "FR-20,BR-6"
answer = "Delegated default 2026-10-01 (reversible), see T-020-decision-log a8: a live owner is never displaced; TTL only when owner liveness is unknown."
resolved_on = "2026-10-01"

