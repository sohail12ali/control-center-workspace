[[items]]
id = "Q1"
status = "resolved"
text = "G2: Which Run owns a claim? The claim verb records only an identity string, so 'owner run is dead' cannot be evaluated; and 'any active Run on the ticket protects the claim' would wrongly block a new owner whose own Run is live. Proposal: add optional ticket.toml claimed_run, set from an explicit run= arg or auto-linked when exactly one ACTIVE chat Run exists on the ticket; empty means unknown (any ACTIVE Run on the ticket protects the claim)."
type = "requirement"
priority = "critical"
raised_by = "agent"
raised_on = "2026-10-01"
affects = "FR-19,FR-20,FR-21"
answer = "Delegated default 2026-10-01 (reversible), see T-020-decision-log a9: claimed_run on ticket.toml; explicit run= or auto-link to the sole ACTIVE chat Run; empty = unknown, any ACTIVE Run on the ticket protects the claim."
resolved_on = "2026-10-01"

[[items]]
id = "Q2"
status = "resolved"
text = "G3: BR-1 makes terminal Runs immutable, but a live chat can take further turns after its Run reached done. Which turns does a Run cover? Proposal: a Run covers its chat from creation until the first terminal state; later turns on the same chat are untracked (a human is present)."
type = "requirement"
priority = "critical"
raised_by = "agent"
raised_on = "2026-10-01"
affects = "FR-1,FR-3"
answer = "Delegated default 2026-10-01 (reversible), see T-020-decision-log a2: a Run covers its chat until the first terminal state; later turns untracked."
resolved_on = "2026-10-01"

[[items]]
id = "Q3"
status = "resolved"
text = "G5: Session event ring holds 4000 events and the watchdog ticks every 15 s, so a turn.end can scroll out of the ring before sync reads it. Proposal: BaseSession retains last_turn (the turn.end event plus that turn's last rate_limit notice) and a turn counter as attributes, and sync_run reads those, never the ring."
type = "requirement"
priority = "critical"
raised_by = "agent"
raised_on = "2026-10-01"
affects = "FR-3,FR-4,FR-11"
answer = "Delegated default 2026-10-01 (reversible), see T-020-decision-log a3: BaseSession keeps last_turn and a turn counter; sync_run reads them, never the ring."
resolved_on = "2026-10-01"

[[items]]
id = "Q4"
status = "resolved"
text = "Scope: which chats get a Run-level watchdog, retry and reconcile? Proposal: only executor=chat Runs created by delegate/launch-role; chats a human starts in the Agents tab have no Run and are never auto-killed or retried. Process hygiene (tree kill, env strip, output cap, lingering kill) applies to every chat."
type = "scope"
priority = "high"
raised_by = "agent"
raised_on = "2026-10-01"
affects = "FR-3,FR-14,BR-9"
answer = "Delegated default 2026-10-01 (reversible), see T-020-decision-log a4: only executor=chat Runs get watchdog/reconcile/retry; hygiene applies to all chats."
resolved_on = "2026-10-01"

