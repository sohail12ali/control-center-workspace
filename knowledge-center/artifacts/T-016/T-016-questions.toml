text = "How does the console launch a harness role if Cursor IDE has no inbound start API? (a) durable Run plus a prompt package a human or Cursor opens (b) spawn cursor-agent CLI as a console chat despite the hybrid lock (c) MCP tool only callable from inside an already-running Cursor session"
