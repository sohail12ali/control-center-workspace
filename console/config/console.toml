[general]
# What this workspace is called. Shows in the brand header, the browser tab and
# every static export. Leaving it at the stock "Delivery Console" is what the
# onboarding checklist nags about.
title          = "Noble Delivery Console"
data_root      = "knowledge-center/artifacts"
id_pattern     = "^[A-Z][A-Za-z0-9-]{1,31}$"
# Loopback by default, and it should usually stay that way.
#
# The console has NO authentication of its own. The supported way to reach it
# from elsewhere is a private network — Tailscale or equivalent — that
# authenticates before traffic ever arrives, so put the tailnet address here
# (or 0.0.0.0 if the machine is only on the tailnet) rather than adding a
# password to this app. A second, weaker authentication layer beside a working
# one adds risk without adding safety.
#
# Any non-loopback value prints a warning at every start. That is deliberate:
# a console listening beyond this machine must never be a fact you forgot.
# Never expose this port directly to the internet.
host           = "127.0.0.1"
port           = 8790
enabled_boards = ["tickets", "investigations"]
# "migrations"/"releases" boards stay config-driven under config/boards/
# (disabled by default, same as the boards list); "projects" and "files" tabs
# are intentionally not implemented at all in this generic template.
#
# Which non-board TABS exist is NOT set here — it comes from which plugin rows
# are enabled in config/plugins.toml, so a tab and the routes behind it are
# switched together and can never disagree.

# Agent backends live in config/agents.toml, NOT here. This file once carried an
# `[agents.backends.*]` block; agents.toml superseded it, and leaving a dead copy
# behind made two files look like they both configured the same thing.
#
# `agent_backends._from_legacy()` still reads the old shape, but ONLY when
# agents.toml is absent — that path exists so an older checkout keeps working,
# not as a place to edit. Add or change a backend in agents.toml.

# Push a parked approval to a phone. Without this, a run started from anywhere
# but this desk stalls at its first gated tool and dies on the 300-second
# timeout with nothing said about it — so this is what makes remote running
# work, not a decoration on top of it.
#
# Credentials go in the workspace's `.env` (gitignored, loaded automatically)
# or your shell. Read per send, never stored:
#   TELEGRAM_BOT_TOKEN   from @BotFather
#   TELEGRAM_CHAT_ID     your own chat id (message the bot, then check
#                        https://api.telegram.org/bot<token>/getUpdates)
#
# Delivery is best-effort and off the request thread. If Telegram is
# unreachable the approval still appears in the browser and still denies on the
# same timeout — you are simply not told, which is no worse than not having
# this configured at all.
#
# Off by default: this template ships no credentials and cannot verify any.
[notify]
enabled     = true
channel     = "telegram"
token_env   = "TELEGRAM_BOT_TOKEN"
chat_id_env = "TELEGRAM_CHAT_ID"
# "approval" is the one that matters. A phone that buzzes for everything gets
# muted, and then it buzzes for nothing.
#   approval   a gated tool is waiting on a human
#   turn_end   a run finished (or failed)
#   job_error  a scheduled job died — by definition nobody was watching
events      = ["approval", "turn_end", "job_error"]
timeout     = 8

# --- inbound: answering from the phone, not just being told ------------------
# Off by default, and it should stay off unless you have set the allowlist.
#
# With this on, tapping a button answers a parked approval — including
# `run_command`, which runs a shell command on this machine. The allowlist is
# then the ONLY thing between a Telegram message and that shell, because a bot
# token addresses a public endpoint that anyone who finds it can message.
#
# TELEGRAM_ALLOWED_USERS is a comma-separated list of numeric Telegram USER
# ids (not chat ids) — `kanban notify chat-id` prints yours. It is FAIL-CLOSED:
# empty or unset means the bot answers nobody. That is deliberate; treating an
# empty list as "everyone" is how a pasted token becomes a remote shell.
inbound              = false
allowed_users_env    = "TELEGRAM_ALLOWED_USERS"
# Development only. Named so it cannot be set by accident, and announced at
# every start when it is on.
allow_all_users_env  = "TELEGRAM_ALLOW_ALL_USERS"
poll_timeout         = 25

# Who asked the console to start work or change state, and from where.
# Records only actions that DO something — starting a chat, running or queuing
# a verb, answering an approval. Not reads: an audit log that records every
# board poll is one nobody scrolls through.
#
# Local and gitignored by default. These lines carry client addresses, which
# are a fact about your network rather than about the project.
[audit]
enabled = true
dir     = "console/.cache/audit"
