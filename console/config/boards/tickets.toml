[board]
kind    = "tickets"
label   = "Tickets"
enabled = true
blurb   = "Delivery work — requirements through verification"

# Lane flags are all optional and default off:
#   terminal = true   work here is done; excluded from open-work counts/badges
#   wip = N           soft limit — the UI warns above it, never blocks
#   tone = "..."      header colour: ok | warn | danger | info
[[lanes]]
id = "open"
label = "Open"

[[lanes]]
id = "in-progress"
label = "In Progress"
wip = 3

[[lanes]]
id = "blocked"
label = "Blocked"
tone = "danger"

[[lanes]]
id = "verify"
label = "Verify"
tone = "info"

[[lanes]]
id = "done"
label = "Done"
terminal = true
tone = "ok"

[card]
show_trackers = ["questions", "bugs", "todos"]
