# Agent backends — which CLIs the Agents tab can talk to.
#
# Adding a backend is CONFIG, NOT CODE. Copy a [[backend]] block, point it at
# an executable, declare its transport, and it appears in the composer. The two
# rows below have no special status; delete them and the tab offers whatever
# remains.
#
# transport — the one field that changes what the UI offers:
#
#   stream_json  ONE process for the whole chat, stdin held open as a
#                JSON-lines channel. Supports STEERING (a message admitted
#                mid-turn) and a true interrupt.
#   resume       ONE process PER TURN, continued via a resume flag. Streams
#                output, but stdin is not a channel, so a message can only be
#                QUEUED for the next turn.
#   oneshot      one process, one prompt, no continuation.
#   openai_api   NO process at all. The console talks to an OpenAI-compatible
#                HTTP endpoint and runs the agent loop itself, which is what
#                lets that loop hold the console's own verbs as tools and use
#                the same approval gate. Needs `base_url` + `api_key_env`
#                instead of `command`, and `installed` means "the key is set",
#                not "a binary is on PATH".
#
# The UI reads `steerable` from the transport and hides the steer control
# where the CLI cannot do it, rather than offering a button that lies.
#
# Placeholders in the *_args templates: {prompt} {mode} {model} {persona}
# {settings} {resume_id} {dir} {system_append}. An arg whose placeholder
# resolves to empty is dropped along with the flag in front of it, so optional
# flags simply vanish instead of being passed as "".
#
# prompt_prefix_style — how a chosen skill/persona is referenced:
#   slash   "@persona /skill text"  (CLI has slash commands)
#   inline  a sentence naming the SKILL.md path (CLI has no slash commands)
#   none    the text, untouched
#
# NOTE: full-bypass permission modes are deliberately not listed. Turning the
# approval gate off is a decision for a terminal you are sitting in front of,
# not a button on a web page. A fork that wants one adds it here and owns it.

# ---------------------------------------------------------------- claude ----
[[backend]]
id = "claude"
label = "Claude Code"
command = "claude"
transport = "stream_json"
prompt_prefix_style = "slash"

# --include-partial-messages is what makes token streaming possible at all;
# --replay-user-messages echoes our own sends back, which is how a steer is
# confirmed as admitted rather than merely written.
session_args = [
  "-p",
  "--input-format", "stream-json",
  "--output-format", "stream-json",
  "--include-partial-messages",
  "--replay-user-messages",
  "--verbose",
  "--permission-mode", "{mode}",
  "--model", "{model}",
  "--agent", "{persona}",
  "--settings", "{settings}",
  "--append-system-prompt", "{system_append}",
]
add_dir_args = ["--add-dir", "{dir}"]

# The one-shot form, used by `kanban agents launch` (and nothing else — the tab
# always opens a session). Kept separate from session_args because the two are
# genuinely different invocations, not the same one with a flag removed: no
# stream-json stdin channel, no partial messages, no approval hook. A backend
# with no oneshot_args and no turn_args simply cannot be launched that way, and
# `agents.launch()` says so instead of guessing at flags.
oneshot_args = [
  "-p", "{prompt}",
  "--permission-mode", "{mode}",
  "--model", "{model}",
]

modes = ["plan", "default", "acceptEdits"]
default_mode = "plan"

# Tools the PreToolUse approval hook gates behind a human in the chat — the
# "Permission needed" card. Empty list = no gate (the CLI runs as before).
# In acceptEdits mode the file-edit tools are auto-allowed server-side so the
# mode blurb stays truthful; everything else still asks.
gated_tools = [
  "Bash", "Write", "Edit", "MultiEdit", "NotebookEdit",
  "WebFetch", "Task", "ExitPlanMode", "KillShell",
  # T-005 desktop tools, under their MCP names. A screenshot sends the pixels
  # of whatever is on screen to Anthropic; a clipboard read can send a
  # password. Both are answered at the desk only (agent_approvals.LOCAL_ONLY).
  "mcp__console__desktop-screenshot",
  "mcp__console__desktop-clipboard-read",
]
approval_timeout = 300

# Models offered in the composer's Model picker — A SHORTLIST, NOT A
# CATALOGUE. claude accepts any alias or pinned id, and the composer keeps a
# custom-id option beside the picker, so anything not listed is one paste
# away. Ids are passed verbatim to `--model` (exact, no date suffixes); the
# UI's own "(backend default)" entry means "send no --model flag at all".
# `[backend.model_labels]` / `[backend.model_hints]` below dress the ids up.
models = [
  "opus",
  "sonnet",
  "haiku",
  "claude-fable-5",
  "claude-opus-5",
  "claude-opus-4-8",
  "claude-opus-4-7",
  "claude-opus-4-6",
  "claude-sonnet-5",
  "claude-sonnet-4-6",
  "claude-haiku-4-5",
]

[backend.mode_blurbs]
plan = "read-only — investigates and proposes, never writes"
default = "gated tools ask you in the chat (Permission needed card)"
acceptEdits = "file writes apply without asking; shell and the rest still ask"

[backend.model_labels]
opus = "Opus (alias)"
sonnet = "Sonnet (alias)"
haiku = "Haiku (alias)"
claude-fable-5 = "Fable 5"
claude-opus-5 = "Opus 5"
claude-opus-4-8 = "Opus 4.8"
claude-opus-4-7 = "Opus 4.7"
claude-opus-4-6 = "Opus 4.6"
claude-sonnet-5 = "Sonnet 5"
claude-sonnet-4-6 = "Sonnet 4.6"
claude-haiku-4-5 = "Haiku 4.5"

[backend.model_hints]
opus = "tracks the newest Opus"
sonnet = "tracks the newest Sonnet"
haiku = "tracks the newest Haiku"
claude-fable-5 = "pinned — most capable"
claude-opus-5 = "pinned"
claude-opus-4-8 = "pinned"
claude-opus-4-7 = "pinned"
claude-opus-4-6 = "pinned"
claude-sonnet-5 = "pinned"
claude-sonnet-4-6 = "pinned"
claude-haiku-4-5 = "pinned"

# ---------------------------------------------------------- cursor-agent ----
[[backend]]
id = "cursor-agent"
label = "Cursor Agent"
command = "cursor-agent"
transport = "resume"
# cursor-agent has no slash-command system, so a skill is named by its path.
prompt_prefix_style = "inline"

# `--trust` is REQUIRED for any headless run: cursor-agent refuses to start in
# a directory it has not been told to trust and prints "Workspace Trust
# Required" instead of doing anything. It answers that prompt for this
# workspace — it does NOT loosen what the agent may then do, which is still
# governed by `--mode` below. The flags cursor-agent also suggests there,
# `--yolo` and `-f`, DO bypass the action gate and are deliberately not used.
turn_args = [
  "-p", "{prompt}",
  "--output-format", "stream-json",
  "--trust",
  "--mode", "{mode}",
  "--model", "{model}",
]
resume_args = [
  "-p", "{prompt}",
  "--output-format", "stream-json",
  "--trust",
  "--resume", "{resume_id}",
  "--mode", "{mode}",
  "--model", "{model}",
]

modes = ["ask", "plan", "default"]
default_mode = "plan"
[backend.mode_blurbs]
ask = "read-only Q&A — explains, never edits"
plan = "analyse and propose; no edits"
default = "prompts before anything unsafe"

# ------------------------------------------------------------ openrouter ----
# No process, no CLI. The console runs the loop, so the tools this agent holds
# are the console's own verbs plus the workspace tools in
# `console/server/agent_tools.py`, and gated calls raise the same "Permission
# needed" card a human already answers for Claude Code.
#
# Set OPENROUTER_API_KEY in the workspace's `.env` (gitignored, loaded
# automatically) or export it in your shell — an exported value always wins.
# The key is read per request, never stored on the session, and never written
# to a transcript, an event, or a telemetry record. Agents cannot read `.env`
# either: it is in the tools' refused-paths list.
#
# `enabled = false` by default: this template ships no key and cannot verify
# one, so the backend stays out of the composer until someone turns it on
# deliberately. Flip it to true once the key is set.

[[backend]]
id = "openrouter"
label = "OpenRouter"
transport = "openai_api"
enabled = true
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout = 180

# A skill has to be INJECTED for a model with no slash-command system, which
# prompt_build.py does — so the prompt itself carries the text, and nothing is
# prefixed onto the user's message.
prompt_prefix_style = "none"

# The loop is the console's, so this list is enforced by the console rather
# than by a CLI's own hook. Read-only `console_*` verbs are deliberately NOT
# gated: asking a human to approve "look up this ticket's lane" trains them to
# click allow without reading, which is how a gate stops working for the calls
# that matter.
gated_tools = ["write_file", "edit_file", "run_command",
               "console_desktop_screenshot",
               "console_desktop_clipboard_read"]
approval_timeout = 300

# Budgets for the loop the console runs. Omit either and it takes the default
# from agent_backends (25 rounds, 120 messages). Both are per-backend because
# one pair of numbers cannot suit a 4k local model and a 200k hosted one.
max_tool_rounds = 25
max_history_messages = 120

# A SHORTLIST, NOT A CATALOGUE — OpenRouter serves hundreds of models and the
# composer keeps a custom-id box beside the picker. Ids are passed verbatim.
# Deliberately left empty in the template: model availability and pricing move,
# and a stale hardcoded list is worse than an empty one plus a paste box.
models = []

modes = ["default"]
default_mode = "default"

# KEEP SUB-TABLES LAST. Everything below a `[backend.*]` header belongs to that
# sub-table, so a plain key written after it is silently swallowed — `models`
# used to sit down here and parsed as `mode_blurbs.models`, which is why the
# shortlist above never reached the picker.
[backend.mode_blurbs]
default = "writes and shell ask you in the chat; reads and console lookups do not"

# ------------------------------------------------------------------ qwen ----
# Qwen Code — a coding CLI with a Claude-Code-shaped flag surface. Verified
# against `qwen --help`, version 0.15.11, on 2026-08-29: every flag below is
# real and its values are the documented ones.
#
# ONE-SHOT, and the `notes` line says so on the card. qwen does have
# `-r/--resume <id>` and `--session-id`, so per-turn continuity is reachable —
# but only if its stream-json init event carries a session id in the shape
# `agent_session._observe` reads. That has NOT been verified here (it needs a
# live run, which spends real quota), and a `resume_args` row written on the
# assumption would degrade silently: `_expand` drops an empty `{resume_id}`,
# so every turn would quietly start fresh while the UI implied a conversation.
# One-shot that says it is one-shot beats continuity that might not be.
#
# To upgrade it: run a chat, check console/.cache/chats/<id>.log for an init
# event with a session id, then add resume_args = [..., "--resume", "{resume_id}"].
[[backend]]
id = "qwen"
label = "Qwen Code"
command = "qwen"
transport = "oneshot"
prompt_prefix_style = "inline"
notes = "one-shot — each turn starts fresh, with no memory of the last"

# stream-json rather than text: it carries tool calls and usage, which the
# normalizer already understands. Nothing about that parsing is claude-specific
# — see Normalizer's docstring.
turn_args = [
  "--output-format", "stream-json",
  "--include-partial-messages",
  "--approval-mode", "{mode}",
  "--model", "{model}",
  "-p", "{prompt}",
]
add_dir_args = ["--include-directories", "{dir}"]

modes = ["plan", "default", "auto-edit"]
default_mode = "plan"
[backend.mode_blurbs]
plan = "plan only — proposes, never writes"
default = "prompts for approval on its own terms, in its own process"
auto-edit = "auto-approves edit tools; everything else still asks"

# ---------------------------------------------------------------- ollama ----
# A model running on this machine. Free, private, works offline.
#
# `auth = "none"` is the point of this row: Ollama takes no API key, and under
# the previous availability model — which asked every API backend whether a key
# was set — it could never be available. Availability here is a probe of
# base_url: is the server actually answering.
#
# Ollama serves an OpenAI-compatible surface at /v1 alongside its native API,
# so `openai_client` talks to it unchanged.
#
# ONE REAL CAVEAT, and it decides whether this is useful to you: the console
# runs the agent loop, and that loop needs TOOL CALLING. Local model support
# for tools is uneven — a model without it will hold a conversation but never
# read a file or run a verb. Pick a tool-capable model (qwen3, llama3.1+,
# mistral-nemo and similar); the session says so on the first turn if the model
# ignores the tools it was offered.
#
# `enabled = false` because the template cannot know whether you run Ollama.
[[backend]]
id = "ollama"
label = "Ollama"
transport = "openai_api"
enabled = false
auth = "none"
base_url = "http://127.0.0.1:11434/v1"
timeout = 300
start_hint = "Start it with `ollama serve`."
notes = "local — free, private, offline. Needs a tool-capable model."
prompt_prefix_style = "none"

gated_tools = ["write_file", "edit_file", "run_command",
               "console_desktop_screenshot",
               "console_desktop_clipboard_read"]
approval_timeout = 300

# A local model's context is usually far smaller than a hosted one's, so the
# history cap is lower here — 120 messages would overflow a 4k window long
# before the count was reached, and the model would simply start failing.
max_tool_rounds = 15
max_history_messages = 40

# Left empty deliberately: your pulled models are a fact about this machine,
# not about the template. `kanban agents models ollama --refresh` reads them
# from the running server and caches them for the picker.
models = []

modes = ["default"]
default_mode = "default"

# Sub-tables last — a plain key below this header lands inside it.
[backend.mode_blurbs]
default = "writes and shell ask you in the chat; reads and console lookups do not"

# ------------------------------------------------------------- lm-studio ----
# Same shape as ollama — a local OpenAI-compatible server, no key. LM Studio
# serves on :1234 by default and must have a model LOADED, not merely
# downloaded: the endpoint answers either way, so a probe that says "available"
# still leaves "no model loaded" as the next thing you might hit.
[[backend]]
id = "lm-studio"
label = "LM Studio"
transport = "openai_api"
enabled = false
auth = "none"
base_url = "http://127.0.0.1:1234/v1"
timeout = 300
start_hint = "Start the local server from LM Studio's Developer tab, and load a model."
notes = "local — the server must be running AND a model loaded."
prompt_prefix_style = "none"

gated_tools = ["write_file", "edit_file", "run_command",
               "console_desktop_screenshot",
               "console_desktop_clipboard_read"]
approval_timeout = 300

# Same reasoning as ollama: a locally served model's window is the constraint.
max_tool_rounds = 15
max_history_messages = 40

models = []

modes = ["default"]
default_mode = "default"

# Sub-tables last — a plain key below this header lands inside it.
[backend.mode_blurbs]
default = "writes and shell ask you in the chat; reads and console lookups do not"

# ------------------------------------------------------------- examples -----
# A third CLI, or a local script, needs nothing but a row. Enable and edit:
#
# [[backend]]
