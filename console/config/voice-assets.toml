# Speech models and voices the Settings tab can download (T-031).
#
# Reviewed like agents.toml and pricing.toml: committed, not per machine, and
# the ONLY place a download URL or a hash enters the repo. Every URL is pinned
# to a Hugging Face commit, so the bytes behind each sha256 cannot change.
# Values come from knowledge-center/artifacts/T-031/T-031-decision-log.md D-2
# (read from the Hugging Face tree API 2026-10-05, LFS oid = sha256 of the
# content, confirmed by the x-linked-etag header). Nothing here is typed from
# memory; to refresh, re-run the tree API and change commit + hashes together.
#
# hash_source = hf-lfs-oid       the sha256 Hugging Face publishes (large files)
# hash_source = computed-pinned  small non-LFS file: Hugging Face publishes only
#                                a git blob sha1 (git_blob_sha1), so the sha256
#                                was computed from the commit-pinned download
#                                and the git blob sha1 was matched against it.
#
# Written in the console's tomlio subset: [[array]] tables, scalars, no inline
# tables, no multi-line strings, no trailing comments (server/tomlio.py).
#
# Engines (whisper-server, piper) are NOT catalogued: models and voices only
# (decision D-3). Filenames are a shared contract with the desktop shell:
# ggml-{id}.bin for a model, {voice}.onnx + {voice}.onnx.json for a voice.

